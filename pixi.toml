[workspace]
name = "net_com_zen"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.13"
rust = ">=1.77"
c-compiler = "*"
numpy = ">=1.26"
pydantic = ">=2.7"
pyyaml = ">=6"
pytest = ">=8"
pyarrow = ">=16"
matplotlib = ">=3.8"
pandas = ">=2.0"
plotly = ">=5.20"
streamlit = ">=1.33"
pip = "*"

[pypi-dependencies]
netcom-zen = { path = ".", editable = true }
eclipse-zenoh = ">=1.0"

[activation.env]
PYTHONNOUSERSITE = "1"

# ROS 2 Jazzy via RoboStack (ADR-0006), opt-in: `pixi run -e ros2 ...`.
# RoboStack pins python to 3.12; the default env solves separately and is unaffected.
[feature.ros2]
channels = ["robostack-jazzy"]

[feature.ros2.dependencies]
python = "3.12.*"
ros-jazzy-ros-base = "*"
ros-jazzy-rmw-zenoh-cpp = "*"
ros-jazzy-demo-nodes-py = "*"
ros-jazzy-rviz2 = "*"

[feature.ros2.tasks]
ros2-smoke = "pytest tests -v -k ros2"
ros2-sudo-test = "sudo $(which python) -m pytest tests -v -m sudo -k ros2"
rviz = "rviz2 -d scenarios/netcom.rviz --ros-args -p use_sim_time:=true"
viz-demo = "python -m netcom_zen.ros2_bridge.demo"

# Isaac Sim 6 (ADR-0006, plan R4), opt-in: `pixi run -e isaac ...`. Tens of GB,
# never part of the default env. Standalone (no default feature): isaacsim pins
# exact pypi versions (requests etc.) that conflict with conda-solved defaults;
# the stepper process needs only stdlib + netcom_zen + isaacsim anyway.
[feature.isaac]

# isaacsim wheels are manylinux_2_35; pixi's default assumption is older.
# Host floor: Ubuntu 24.04 = glibc 2.39 (ADR-0006 verified facts).
[feature.isaac.system-requirements]
libc = { family = "glibc", version = "2.35" }

[feature.isaac.dependencies]
python = "3.12.*"

[feature.isaac.activation.env]
# non-interactive acceptance of the NVIDIA Omniverse EULA (ADR-0006 committed
# the project to Isaac Sim; first import blocks on a prompt otherwise)
OMNI_KIT_ACCEPT_EULA = "YES"
# REQUIRED: this env is no-default-feature, so it does NOT inherit the
# workspace [activation.env] above. Without it, ~/.local site-packages leak in
# and a newer user-site pydantic shadows the pinned one — and Isaac's kit
# Python re-checks site at boot, so config imports made AFTER SimulationApp()
# (e.g. isaac-preview) crash with `cannot import name 'Sentinel'`. Verified:
# with this set, kit's interpreter reports ENABLE_USER_SITE=False.
PYTHONNOUSERSITE = "1"

[feature.isaac.pypi-options]
extra-index-urls = ["https://pypi.nvidia.com"]
# some isaacsim deps (e.g. mujoco-usd-converter) need versions that live on
# pypi.org while pypi.nvidia.com also publishes the name; first-index-wins
# can't see them. Both indexes are trusted.
index-strategy = "unsafe-best-match"

[feature.isaac.pypi-dependencies]
netcom-zen = { path = ".", editable = true }
pytest = ">=8"
isaacsim = { version = "==6.0.0.1", extras = ["all", "extscache", "ros2"] }
# isaacsim-core needs this prerelease; an explicit pin is how the resolver
# is told prereleases are acceptable for the package
tinyobjloader = "==2.0.0rc13"

[feature.isaac.tasks]
# Stepper owns the GPU/Isaac process; the (root) orchestrator only connects to
# the socket, so Isaac caches stay under the invoking user, not root.
isaac-stepper = "python -m netcom_zen.isaac_stepper"
# watch Isaac drive a scenario live in the viewport (no root, single terminal)
isaac-preview = "python -m netcom_zen.isaac_stepper.preview"
# only the GPU smoke: the env is standalone, so the rest of the tree (which
# needs default-env deps) doesn't even collect here; protocol/provider tests
# run in the default env via `pixi run test`
isaac-smoke = "pytest tests/test_isaac_real.py -v"

[environments]
ros2 = ["ros2"]
isaac = { features = ["isaac"], no-default-feature = true }

[tasks]
test = "pytest tests -v"
sudo-test = "sudo $(which python) -m pytest tests -v -m sudo"
validate = "pytest validation -v && python validation/report.py"
setup-check = "python -m netcom_zen.setup_check"
build-agent = "cargo build --release --manifest-path agent/Cargo.toml"
# Standalone tactical dashboard (self-contained HTML, smooth synced playback).
dashboard = "python -m netcom_zen.viz.serve"
# Write the portable dashboard to a file (default dashboard.html, all playable runs).
viz-export = "python -m netcom_zen.viz.export"
# Legacy Streamlit/Plotly front end, kept for reference.
dashboard-streamlit = "streamlit run sim/netcom_zen/viz/app.py"
