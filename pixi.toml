[workspace]
name = "net_com_zen"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.13"
rust = ">=1.77"
c-compiler = "*"
numpy = ">=1.26"
pydantic = ">=2.7"
pyyaml = ">=6"
pytest = ">=8"
pyarrow = ">=16"
matplotlib = ">=3.8"
pandas = ">=2.0"
plotly = ">=5.20"
streamlit = ">=1.33"
pip = "*"

[pypi-dependencies]
netcom-zen = { path = ".", editable = true }
eclipse-zenoh = ">=1.0"

[activation.env]
PYTHONNOUSERSITE = "1"

[tasks]
test = "pytest tests -v"
sudo-test = "sudo $(which python) -m pytest tests -v -m sudo"
validate = "pytest validation -v && python validation/report.py"
setup-check = "python -m netcom_zen.setup_check"
build-agent = "cargo build --release --manifest-path agent/Cargo.toml"
dashboard = "streamlit run sim/netcom_zen/viz/app.py"
