# resilience_4node with the ray-traced pathloss backend (M5.3): identical
# geometry/jammer, but link loss comes from the precomputed Sionna RT grid
# (grids/resilience_4node_433.npz) instead of the analytical composite.
# Foliage is still Weissberger on top — the RT scene carries no vegetation.
name: sionna-4node
duration_s: 60
tick_hz: 10
seed: 0
radio:
  freq_hz: 433.0e+6
  bandwidth_hz: 250.0e+3
  tx_power_dbm: 27.0
  noise_figure_db: 7.0
  data_rate_bps: 250.0e+3
  hop: {n_channels: 50, hop_rate_hz: 100.0}
nodes:
  - {id: v1, waypoints: [[150, 300], [400, 300]], speed_mps: 3.0}
  - {id: v2, waypoints: [[150, 500], [400, 500]], speed_mps: 3.0}
  - {id: v3, waypoints: [[150, 700], [400, 700]], speed_mps: 3.0}
  - {id: v4, waypoints: [[600, 500], [850, 500]], speed_mps: 3.0}
environment:
  extent_m: [1000, 1000]
  pathloss: sionna
  sionna_grid: grids/resilience_4node_433.npz
  foliage:
    - {x_min: 450, x_max: 550, y_min: 0, y_max: 1000}
agent:
  enabled: true
jammers:
  - id: j1
    kind: barrage
    position: [500, 900]
    tx_power_dbm: 40.0
    bandwidth_hz: 12.5e6
    start_s: 20.0
