# M3 base scenario: 4 vehicles patrol a mixed open-field/forest map sharing
# MLS-encrypted CRDT state; a jammer activates one third into the run.
name: resilience-4node
duration_s: 60
tick_hz: 10
seed: 0  # overridden by the sweep
radio:
  freq_hz: 433.0e6
  bandwidth_hz: 250.0e3
  tx_power_dbm: 27.0
  noise_figure_db: 7.0
  data_rate_bps: 250.0e3
  hop: {n_channels: 50, hop_rate_hz: 100.0}  # hop rate is a sweep axis
nodes:
  - {id: v1, waypoints: [[150, 300], [400, 300]], speed_mps: 3.0}
  - {id: v2, waypoints: [[150, 500], [400, 500]], speed_mps: 3.0}
  - {id: v3, waypoints: [[150, 700], [400, 700]], speed_mps: 3.0}
  - {id: v4, waypoints: [[600, 500], [850, 500]], speed_mps: 3.0}  # beyond the forest
environment:
  extent_m: [1000, 1000]
  foliage:
    - {x_min: 450, x_max: 550, y_min: 0, y_max: 1000}  # 100 m forest strip
jammers:
  - id: j1
    kind: barrage          # sweep overrides kind/power
    position: [500, 900]
    tx_power_dbm: 40.0     # sweep axis
    bandwidth_hz: 12.5e6   # covers all 50 x 250 kHz hop channels
    channels: [0, 1, 2, 3, 4, 5, 6, 7]  # used when kind: spot
    start_s: 20.0
agent:
  enabled: true
  period_ms: 500
  full_every: 10
