# M4 failover: 3 vehicles patrol; a stationary command node sits at the edge of
# the swarm's radio range. Normally every vehicle reaches command via the
# satellite uplink (40 ms, jammer-immune). At t=20 s the satellite outage begins
# and swarm state must reach command over the degraded RF mesh.
name: failover-4node
duration_s: 45
tick_hz: 10
seed: 0
radio:
  freq_hz: 433.0e6
  bandwidth_hz: 250.0e3
  tx_power_dbm: 27.0
  noise_figure_db: 7.0
  data_rate_bps: 250.0e3
  hop: {n_channels: 50, hop_rate_hz: 100.0}
nodes:
  - {id: v1, waypoints: [[150, 480], [350, 480]], speed_mps: 3.0}
  - {id: v2, waypoints: [[150, 520], [350, 520]], speed_mps: 3.0}
  - {id: v3, waypoints: [[250, 500]], speed_mps: 0.1}
  - {id: cmd, role: command, waypoints: [[520, 500]], speed_mps: 0.1}
environment:
  extent_m: [1000, 1000]
satellite:
  enabled: true
  delay_ms: 40.0
  bandwidth_bps: 2.0e6
  outages:
    - {start_s: 20.0}   # uplink lost from t=20 s to end of run
agent:
  enabled: true
  period_ms: 500
  full_every: 10
